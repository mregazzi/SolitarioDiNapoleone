# Pubblica il gioco su GitHub Pages a ogni nuova release.
# Si può anche avviare a mano dalla scheda Actions ("Run workflow").
name: Pubblica il gioco

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara i file del gioco
        run: |
          mkdir -p sito
          cp index.html sito/
          cp -r carte sito/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - id: deploy
        uses: actions/deploy-pages@v4
